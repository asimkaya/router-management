[package]
name = "router-management"
version = "0.1.0"
description = "Open-source desktop app for managing home modem/routers"
authors = ["RouterDesk Contributors"]
edition = "2021"

[lib]
name = "router_management_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
parking_lot = "0.12"
urlencoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["cookies", "json", "rustls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
